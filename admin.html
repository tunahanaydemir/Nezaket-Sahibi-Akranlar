<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel – Nezaket Sahibi Akranlar</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080B11;--bg2:#101422;--bg3:#1A2035;--border:#242D46;--border2:#364468;
  --blue:#3B82F6;--blue-dim:#132548;--green:#10B981;--green-dim:#0B2F24;
  --red:#EF4444;--red-dim:#311212;--orange:#F59E0B;
  --text:#F3F4F6;--text2:#9CA3AF;--text3:#4B5563;
  --r:16px;--rs:12px;--font:'Inter',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 60px}

/* GİRİŞ EKRANI (AUTH) */
#authPanel{position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;transition:opacity .4s ease,visibility .4s}
#authPanel.hidden{opacity:0;visibility:hidden}
.auth-card{width:100%;max-width:360px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:28px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.5)}
.auth-icon{font-size:40px;margin-bottom:12px;display:inline-block;animation:pulse 2s infinite}
.auth-title{font-size:20px;font-weight:900;margin-bottom:6px}
.auth-sub{font-size:13px;color:var(--text2);margin-bottom:20px}
.auth-input{width:100%;padding:14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);color:#fff;font-family:var(--font);font-size:16px;text-align:center;font-weight:700;letter-spacing:4px;margin-bottom:14px;transition:border-color .2s}
.auth-input:focus{outline:none;border-color:var(--blue)}

/* GENEL DÜZEN */
#mainContent{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center}
h1{font-size:24px;font-weight:900;margin-bottom:4px;text-align:center;letter-spacing:-0.5px}
.sub{font-size:13px;color:var(--text2);margin-bottom:24px;text-align:center}

/* CARDS */
.card{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.sc-hdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.sc-hdr-icon{font-size:22px}
.sc-hdr-title{font-size:15px;font-weight:800}
.sc-hdr-sub{font-size:12px;color:var(--text2);margin-top:2px}
.sc-body{padding:20px}

/* CAMERA SELECTOR */
.selector-wrapper{margin-bottom:12px}
.select-css{display:block;width:100%;font-size:14px;font-family:var(--font);font-weight:600;color:var(--text);padding:12px;box-sizing:border-box;border:1px solid var(--border);border-radius:var(--rs);background-color:var(--bg3);appearance:none;cursor:pointer}
.select-css:focus{outline:none;border-color:var(--blue)}

#reader{width:100%;border-radius:var(--rs);overflow:hidden;background:#000;min-height:240px;display:flex;align-items:center;justify-content:center;position:relative}
#reader video{border-radius:var(--rs);object-fit: cover}

/* DURUM */
.status{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:var(--rs);font-size:13px;font-weight:700;margin-top:14px}
.st-idle{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.st-ok{background:var(--green-dim);color:var(--green);border:1px solid rgba(16,185,129,.25)}
.st-err{background:var(--red-dim);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.st-scan{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(59,130,246,.25);animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* BUTONLAR */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 20px;border:none;border-radius:var(--rs);font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-green{background:var(--green);color:#022c1e;box-shadow:0 4px 14px rgba(16,185,129,.2)}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(59,130,246,.2)}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-ghost:hover{border-color:var(--text2);color:var(--text)}
.gap{height:12px}

/* SONUÇ KARTI */
.result-card{display:none;border:1px solid var(--border2)}
.result-card.show{display:block;animation:slideUp 0.3s ease-out}
@keyframes slideUp { from{transform:translateY(15px);opacity:0} to{transform:translateY(0);opacity:1} }
.rc-badge{display:inline-flex;align-items:center;gap:6px;background:var(--green-dim);color:var(--green);border:1px solid rgba(16,185,129,.25);font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:20px;margin-bottom:16px}
.rc-team{font-size:28px;font-weight:900;margin-bottom:4px;letter-spacing:-0.5px}
.rc-date{font-size:12px;color:var(--text2);margin-bottom:14px}
.rc-members{font-size:14px;color:var(--text);font-weight:600;margin-bottom:8px;background:var(--bg3);padding:10px 14px;border-radius:var(--rs);border:1px solid var(--border)}
.rc-promise{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:14px;font-size:14px;color:var(--text2);margin-bottom:20px;line-height:1.6}
.rc-promise strong{color:var(--text);display:block;margin-bottom:5px;font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.btns{display:flex;flex-direction:column;gap:10px}

/* GEÇMİŞ */
.hc-hdr{padding:14px 20px;border-bottom:1px solid var(--border);font-size:12px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
.hc-hdr span{font-size:12px;color:var(--text3);font-weight:600;text-transform:none;letter-spacing:0;cursor:pointer;transition:color .2s}
.hc-hdr span:hover{color:var(--red)}
.hist-row{padding:14px 20px;border-bottom:1px solid rgba(36,45,70,.5);cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:14px}
.hist-row:last-child{border-bottom:none}
.hist-row:hover{background:var(--bg3)}
.hist-icon{font-size:22px}
.hist-name{font-size:15px;font-weight:700}
.hist-meta{font-size:12px;color:var(--text3);margin-top:2px}
.hist-empty{padding:30px;text-align:center;color:var(--text3);font-size:14px}

/* OVERLAY PRINT */
.print-ov{position:fixed;inset:0;background:rgba(4,6,10,.9);display:none;align-items:center;justify-content:center;z-index:9000;flex-direction:column;gap:16px;padding:20px}
.print-ov.show{display:flex}
.print-ov canvas{border-radius:var(--rs);box-shadow:0 20px 60px rgba(0,0,0,.8);max-width:100%;max-height:70vh;object-fit:contain}
.print-ov-btns{display:flex;gap:12px;width:100%;max-width:400px;justify-content:center}
.pov-btn{flex:1;padding:14px;border:none;border-radius:var(--rs);font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;text-align:center}
.pov-btn:hover{opacity:.85}

/* PRINT MEDIA */
@media print{
  body > *:not(#print-area){display:none!important}
  #print-area{display:block!important;position:fixed;inset:0}
  #print-area canvas,#print-area img{width:100%;height:auto}
}
#print-area{display:none}
</style>
</head>
<body>

<div id="authPanel">
  <div class="auth-card">
    <div class="auth-icon">🛡️</div>
    <div class="auth-title">Admin Panel</div>
    <div class="auth-sub">Enter the passkey</div>
    <input type="password" id="authInput" class="auth-input" placeholder="••••" maxlength="8" oninput="checkAuth(this)">
  </div>
</div>

<div id="mainContent">
  <h1>🛡️ Admin Paneli</h1>
  <p class="sub">Nezaket Sahibi Akranlar — Sertifika Doğrulama</p>

  <div class="card">
    <div class="sc-hdr">
      <div class="sc-hdr-icon">📷</div>
      <div>
        <div class="sc-hdr-title">QR Kod Okuyucu</div>
        <div class="sc-hdr-sub">Kamerayı seçip başlatın</div>
      </div>
    </div>
    <div class="sc-body">
      <div class="selector-wrapper">
        <select id="camRegistry" class="select-css" onchange="onCameraChange()">
          <option value="">🔄 Kameralar yükleniyor...</option>
        </select>
      </div>
      
      <div id="reader"></div>
      <div id="status" class="status st-idle">⬤ &nbsp;Kamera listesi hazırlanıyor...</div>
      <div class="gap"></div>
      <button class="btn btn-blue" id="startBtn" onclick="startScan()">📷 &nbsp;Kamerayı Başlat</button>
      <div class="gap"></div>
      <button class="btn btn-ghost" id="stopBtn" onclick="stopScan()" disabled>⏹ &nbsp;Kamerayı Durdur</button>
    </div>
  </div>

  <div class="card result-card" id="resultCard">
    <div class="sc-body">
      <div class="rc-badge">✓ &nbsp;SERTİFİKA DOĞRULANDI</div>
      <div class="rc-team" id="rc-team">—</div>
      <div class="rc-date" id="rc-date">—</div>
      <div class="rc-members" id="rc-members">—</div>
      <div class="rc-promise"><strong>Nezaket Sözü</strong><span id="rc-promise">—</span></div>
      <div class="btns">
        <button class="btn btn-green" onclick="printCert()">🖨️ &nbsp;Sertifikayı Yazdır / Önizle</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="hc-hdr">📋 Son Okutulan Ekipler <span onclick="clearHistory()">Temizle</span></div>
    <div id="historyList"><div class="hist-empty">Henüz QR okutulmadı</div></div>
  </div>
</div>

<div class="print-ov" id="printOv">
  <canvas id="previewCanvas"></canvas>
  <div class="print-ov-btns">
    <button class="pov-btn" style="background:var(--green);color:#022c1e" onclick="doPrint()">🖨️ Yazdır</button>
    <button class="pov-btn" style="background:var(--blue);color:#fff" onclick="doDownload()">⬇️ PDF</button>
    <button class="pov-btn" style="background:var(--bg3);color:var(--text2);border:1px solid var(--border2)" onclick="closeOverlay()">✕ Kapat</button>
  </div>
</div>
<div id="print-area"></div>

<script>
// ═══════════════════════════════
// STATE & CONFIG
// ═══════════════════════════════
let scanner = null;
let scanning = false;
let currentData = null;
let availableCameras = [];
let selectedCameraId = null;
let history = JSON.parse(localStorage.getItem('nesak-admin-history')||'[]');

// ═══════════════════════════════
// GİRİŞ KONTROLÜ (XLYN)
// ═══════════════════════════════
function checkAuth(input) {
  if(input.value.toLowerCase() === 'xlyn') {
    document.getElementById('authPanel').classList.add('hidden');
    prepareCameras();
  }
}

// ═══════════════════════════════
// KAMERA YÖNETİMİ
// ═══════════════════════════════
async function prepareCameras() {
  try {
    const initialCameras = await Html5Qrcode.getCameras();
    if(!initialCameras || initialCameras.length === 0) {
      setStatus('Kamera bulunamadı veya izin verilmedi.', 'err');
      return;
    }
    
    availableCameras = initialCameras;
    const selectEl = document.getElementById('camRegistry');
    selectEl.innerHTML = '';
    
    availableCameras.forEach((cam, index) => {
      const opt = document.createElement('option');
      opt.value = cam.id;
      opt.textContent = cam.label || `Kamera ${index + 1}`;
      if(cam.label.toLowerCase().includes('back') || cam.label.toLowerCase().includes('arka')) {
        opt.selected = true;
      }
      selectEl.appendChild(opt);
    });

    selectedCameraId = selectEl.value;
    setStatus('Kameralar hazır. Seçiminizi yapıp başlatın.', 'idle');
  } catch (e) {
    setStatus('Kamera erişim hatası: ' + e.message, 'err');
  }
}

function onCameraChange() {
  const selectEl = document.getElementById('camRegistry');
  selectedCameraId = selectEl.value;
  if(scanning) {
    stopScan().then(() => startScan());
  }
}

function setStatus(msg, type='idle'){
  const el = document.getElementById('status');
  el.className = 'status st-'+type;
  el.innerHTML = '⬤ &nbsp;'+msg;
}

async function startScan(){
  if(scanning) return;
  if(!selectedCameraId) {
    setStatus('Lütfen önce listeden geçerli bir kamera seçin.', 'err');
    return;
  }
  
  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
  setStatus('Kamera akışı başlatılıyor...','scan');
  
  try{
    scanner = new Html5Qrcode('reader');
    await scanner.start(
      selectedCameraId,
      { fps: 12, qrbox: { width: 250, height: 250 } },
      onScanSuccess,
      () => {} // Geçersiz QR okunduğunda hiçbir şey yapma, kamera akışı devam etsin
    );
    scanning = true;
    setStatus('QR Kod Hedefte Bekleniyor...','scan');
  }catch(e){
    setStatus('Hata: '+e.message,'err');
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
  }
}

async function stopScan(){
  if(scanner && scanning){
    await scanner.stop();
    scanner.clear();
    scanning = false;
  }
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  setStatus('Kamera durduruldu.','idle');
}

function onScanSuccess(decoded){
  try{
    const data = JSON.parse(decoded);
    // Eğer gelen veri bizim formatta değilse sessizce geç, kamerayı KAPATMA!
    if(data.type !== 'nesak-cert') return; 
    
    // Geçerli veri geldiyse akışı durdur ve işlemleri yap
    stopScan();
    currentData = data;
    showResult(data);
    addToHistory(data);
    setStatus('✓ QR Kod Başarıyla Doğrulandı!','ok');
  }catch(e){
    // JSON parse hatası veya herhangi bir geçersiz kod gelirse tetik vermiyoruz, kamera açık kalıyor.
    console.log("Geçersiz QR algılandı, işlem yapılmadı.");
  }
}

// ═══════════════════════════════
// SONUÇ & GEÇMİŞ YÖNETİMİ
// ═══════════════════════════════
function showResult(d){
  document.getElementById('rc-team').textContent = d.team||'—';
  document.getElementById('rc-date').textContent = d.date||'—';
  document.getElementById('rc-members').textContent = (d.members||[]).join('  •  ');
  document.getElementById('rc-promise').textContent = d.promise||'—';
  
  const rc = document.getElementById('resultCard');
  rc.classList.add('show');
  rc.scrollIntoView({behavior:'smooth', block:'center'});
}

// ═══════════════════════════════
// SERTİFİKA CANVAS ÇİZİM MOTORU
// ═══════════════════════════════
function drawCertCanvas(d){

  const W = 595;
  const H = 842;

  const canvas = document.createElement("canvas");
  canvas.width = W * 2;
  canvas.height = H * 2;

  const ctx = canvas.getContext("2d");
  ctx.scale(2,2);

  const members = d.members || [];

  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = "#111";
  ctx.lineWidth = 4;
  ctx.strokeRect(20,20,W-40,H-40);

  ctx.lineWidth = 1;
  ctx.strokeRect(30,30,W-60,H-60);

  ctx.fillStyle = "#000";
  ctx.textAlign = "center";

  ctx.font = "700 18px Georgia";
  ctx.fillText("NEZAKET SAHİBİ AKRANLAR",W/2,70);

  ctx.font = "900 34px Georgia";
  ctx.fillText("BAŞARI SERTİFİKASI",W/2,120);

  ctx.font = "16px Georgia";
  ctx.fillText(
    `${d.date || ""} tarihinde düzenlenen`,
    W/2,
    185
  );

  ctx.fillText(
    "NESAK Oryantiring Etkinliği'ne",
    W/2,
    215
  );

  ctx.fillText(
    "başarıyla katılım sağlayan",
    W/2,
    245
  );

  ctx.font = "900 32px Georgia";
  ctx.fillText(
    d.team || "Ekip",
    W/2,
    310
  );

  ctx.font = "16px Georgia";
  ctx.fillText(
    "ekibine teşekkür ederiz.",
    W/2,
    345
  );

  ctx.beginPath();
  ctx.moveTo(90,375);
  ctx.lineTo(W-90,375);
  ctx.stroke();

  ctx.font = "700 20px Georgia";
  ctx.fillText(
    "EKİP ÜYELERİ",
    W/2,
    420
  );

  ctx.font = "16px Georgia";

  let y = 455;

  members.forEach(member=>{
    ctx.fillText("• " + member,W/2,y);
    y += 28;
  });

  y += 20;

  ctx.beginPath();
  ctx.moveTo(120,y);
  ctx.lineTo(W-120,y);
  ctx.stroke();

  y += 40;

  ctx.font = "700 18px Georgia";
  ctx.fillText(
    "NEZAKET SÖZÜ",
    W/2,
    y
  );

  y += 35;

  ctx.font = "italic 16px Georgia";

  const promise =
    d.promise ||
    "Nezaket sözü belirtilmemiş.";

  const maxWidth = 420;
  const words = promise.split(" ");

  let line = "";
  let py = y;

  for(let n=0;n<words.length;n++){

    const testLine =
      line + words[n] + " ";

    const metrics =
      ctx.measureText(testLine);

    if(metrics.width > maxWidth && n > 0){
      ctx.fillText(line,W/2,py);
      line = words[n] + " ";
      py += 24;
    }else{
      line = testLine;
    }
  }

  ctx.fillText(line,W/2,py);

  py += 70;

  if(d.mascot){

    ctx.font = "700 18px Georgia";

    ctx.fillText(
      "EKİP MASKOTU",
      W/2,
      py
    );

    py += 35;

    ctx.font = "16px Georgia";

    ctx.fillText(
      `${d.mascotIcon || ""} ${d.mascot}`,
      W/2,
      py
    );

    py += 45;
  }

  // İmza bölümü

ctx.beginPath();
ctx.moveTo(W/2-110,H-135);
ctx.lineTo(W/2+110,H-135);
ctx.stroke();

ctx.font = "bold 16px Georgia";

ctx.fillText(
  "Gazi Sosyal Bilimler Lisesi",
  W/2,
  H-108
);

ctx.font = "15px Georgia";

ctx.fillText(
  "Bilim Kurulu",
  W/2,
  H-86
);

ctx.font = "12px Georgia";

ctx.fillText(
  "Doğrulanmış Sertifika",
  W/2,
  H-50
);

  return canvas;
}

// ═══════════════════════════════
// ÇIKTI MOTORLARI
// ═══════════════════════════════
function printCert(){
  if(!currentData) return;
  const canvas = drawCertCanvas(currentData);
  const prev = document.getElementById('previewCanvas');
  prev.width = canvas.width; prev.height = canvas.height;
  prev.getContext('2d').drawImage(canvas,0,0);
  
  const maxW = Math.min(window.innerWidth*0.92, 500);
  const maxH = window.innerHeight*0.68;
  const scale = Math.min(maxW/canvas.width, maxH/canvas.height);
  prev.style.width  = (canvas.width*scale)+'px';
  prev.style.height = (canvas.height*scale)+'px';
  
  document.getElementById('printOv').classList.add('show');
  
  const pa = document.getElementById('print-area');
  pa.innerHTML='';
  const img=document.createElement('img');
  img.src=canvas.toDataURL('image/png');
  img.style.width='100%';
  pa.appendChild(img);
}

function doPrint(){ window.print(); }

async function doDownload(){
  if(!currentData) return;
  if(!window.jspdf){
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
      s.onload=res; s.onerror=()=>{
        const s2=document.createElement('script');
        s2.src='https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js';
        s2.onload=res; s2.onerror=rej;
        document.head.appendChild(s2);
      };
      document.head.appendChild(s);
    });
  }
  const {jsPDF}=window.jspdf;
  const canvas=drawCertCanvas(currentData);
  const imgData=canvas.toDataURL('image/jpeg',0.92);
  const doc=new jsPDF({orientation:'portrait',unit:'pt',format:'a4'});
  doc.addImage(imgData,'JPEG',0,0,595,842);
  const fn=(currentData.team||'sertifika').replace(/\s+/g,'').toLowerCase()+'_nesak.pdf';
  doc.save(fn);
}

function closeOverlay(){ document.getElementById('printOv').classList.remove('show'); }

// ═══════════════════════════════
// GEÇMİŞ YÖNETİMİ
// ═══════════════════════════════
function addToHistory(d){
  if(history.some(h => h.team === d.team && h.date === d.date)) return;
  
  history.unshift({team:d.team, date:d.date, members:d.members, promise:d.promise, scannedAt:new Date().toLocaleTimeString('tr-TR')});
  if(history.length>15) history.pop();
  localStorage.setItem('nesak-admin-history', JSON.stringify(history));
  renderHistory();
}

function renderHistory(){
  const el=document.getElementById('historyList');
  if(!history.length){el.innerHTML='<div class="hist-empty">Henüz QR okutulmadı</div>';return;}
  el.innerHTML=history.map((h,i)=>`
    <div class="hist-row" onclick="loadFromHistory(${i})">
      <div class="hist-icon">🏆</div>
      <div>
        <div class="hist-name">${h.team}</div>
        <div class="hist-meta">${(h.members||[]).join(' • ')} &nbsp;·&nbsp; ${h.scannedAt}</div>
      </div>
    </div>
  `).join('');
}

function loadFromHistory(i){
  currentData = history[i];
  showResult(currentData);
  setStatus('Geçmiş kaydı yüklendi: '+currentData.team,'ok');
}

function clearHistory(){
  if(!confirm('Tüm tarama geçmişi silinsin mi?')) return;
  history=[];
  localStorage.removeItem('nesak-admin-history');
  renderHistory();
}

document.getElementById('printOv').addEventListener('click',function(e){if(e.target===this)closeOverlay();});

renderHistory();
</script>
</body>
</html>
