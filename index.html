<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nezaket Sahibi Akranlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D1018;--bg2:#141926;--bg3:#1C2333;
  --border:#263040;--border2:#334060;
  --blue:#4C9EEB;--blue-dim:#152840;--blue-glow:rgba(76,158,235,.22);
  --purple:#A78BFA;--purple-dim:#1E1545;--purple-glow:rgba(167,139,250,.22);
  --text:#E8EDF8;--text2:#8A9AB8;--text3:#4A5875;
  --r:16px;--rs:12px;
  --font:'Inter',sans-serif;
}
[data-theme="light"]{
  --bg:#F0F4FA;--bg2:#FFFFFF;--bg3:#E8EDF5;
  --border:#CBD5E8;--border2:#A0AECF;
  --blue-dim:#DBEAFE;--purple-dim:#EDE9FE;
  --text:#1A2035;--text2:#4A5875;--text3:#8A9AB8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);-webkit-font-smoothing:antialiased}
body{
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  overflow:hidden;
  position:relative;
  transition:background .3s, color .3s;
}

/* Arka plan gradient */
body::before{
  content:'';
  position:fixed;inset:0;
  background:radial-gradient(ellipse 70% 50% at 50% 0%, rgba(76,158,235,.10) 0%, transparent 70%),
             radial-gradient(ellipse 50% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 60%);
  pointer-events:none;
  z-index:0;
}

/* GİZLİ ARKAPLAN ALANI — 5 sn basılı tut */
#secret-zone{
  position:fixed;inset:0;
  z-index:1;
  cursor:default;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

/* İÇERİK */
.content{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:28px 24px 48px;
  width:100%;
  max-width:380px;
  gap:0;
}

/* LOGO */
.logo-wrap{
  margin-bottom:32px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  animation:fadeDown .5s ease both;
}
.logo-img{
  width:min(180px, 50vw);
  height:auto;
  border-radius:20px;
  box-shadow:0 8px 36px rgba(76,158,235,.18), 0 2px 12px rgba(0,0,0,.25);
  display:block;
}
.logo-title{
  font-size:22px;
  font-weight:900;
  color:var(--text);
  text-align:center;
  line-height:1.2;
}
.logo-title span{color:var(--blue)}
.logo-sub{
  font-size:12px;
  color:var(--text3);
  font-weight:500;
  text-align:center;
  margin-top:-8px;
}

/* BUTONLAR */
.btns{
  display:flex;
  flex-direction:column;
  gap:11px;
  width:100%;
  animation:fadeUp .5s ease .15s both;
}
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;padding:16px 20px;
  border:none;border-radius:var(--rs);
  font-family:var(--font);font-size:16px;font-weight:800;
  cursor:pointer;
  transition:transform .12s, box-shadow .15s, opacity .15s;
  position:relative;overflow:hidden;
  text-decoration:none;
  letter-spacing:.2px;
}
.btn:active{transform:scale(.97)}
.btn-blue{
  background:linear-gradient(135deg,#4C9EEB,#2E7DD4);
  color:#fff;
  box-shadow:0 5px 22px rgba(76,158,235,.32);
}
.btn-blue:hover{box-shadow:0 7px 30px rgba(76,158,235,.48)}
.btn-purple{
  background:linear-gradient(135deg,#A78BFA,#7C5FD4);
  color:#fff;
  box-shadow:0 5px 22px rgba(167,139,250,.32);
}
.btn-purple:hover{box-shadow:0 7px 30px rgba(167,139,250,.48)}
.btn-icon-wrap{
  width:28px;height:28px;border-radius:8px;
  background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}



/* TEMA BUTONU */
.theme-btn{
  position:fixed;top:14px;right:14px;z-index:20;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:20px;padding:5px 11px;
  font-size:12px;font-weight:700;color:var(--text2);
  cursor:pointer;display:flex;align-items:center;gap:5px;
  box-shadow:0 2px 8px rgba(0,0,0,.18);transition:all .2s;
}
.theme-btn:hover{color:var(--text);border-color:var(--blue)}

/* ANİMASYONLAR */
@keyframes fadeDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<!-- GİZLİ ARKAPLAN — 5 sn basılı tut → admin.html -->
<div id="secret-zone"></div>

<!-- TEMA BUTONU -->
<button class="theme-btn" id="theme-btn" onclick="cycleTheme()">🌙 Karanlık</button>

<!-- İÇERİK -->
<div class="content">
  <div class="logo-wrap">
    <img src="anasayfa.png" alt="Nezaket Sahibi Akranlar Logo" class="logo-img" onerror="this.style.display='none'">
    <div class="logo-title">Nezaket Sahibi<br><span>Akranlar</span></div>
    <div class="logo-sub">Kalp Kırmak Zayıflık, Nazik Olmak Cesarettir!</div>
  </div>

  <div class="btns">
    <a href="oyun.html" class="btn btn-blue">
      <div class="btn-icon-wrap">🧭</div>
      Oryantiringe Başla
    </a>
    <a href="sunum.html" class="btn btn-purple">
      <div class="btn-icon-wrap">📊</div>
      Sunuma Git
    </a>
  </div>
</div>



<script>
// ═══════════════════════════════
// TEMA
// ═══════════════════════════════
(function(){
  const btn = document.getElementById('theme-btn');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  let mode = prefersDark ? 'dark' : 'light';
  applyTheme(mode);
  function applyTheme(m){
    if(m === 'light'){
      document.documentElement.setAttribute('data-theme','light');
      btn.textContent = '☀️ Açık';
    } else {
      document.documentElement.removeAttribute('data-theme');
      btn.textContent = '🌙 Karanlık';
    }
  }
  window.cycleTheme = function(){
    mode = (mode === 'dark') ? 'light' : 'dark';
    applyTheme(mode);
  };
})();

// ═══════════════════════════════
// GİZLİ 5 SANİYE BASMA
// ═══════════════════════════════
const HOLD_MS = 5000;
const zone = document.getElementById('secret-zone');

let holdTimer = null;
let startTime = null;

function startHold(e){
  if(e.target.closest('.btn') || e.target.closest('.theme-btn')) return;
  startTime = Date.now();
  holdTimer = setTimeout(()=>{
    window.location.href = 'admin.html';
  }, HOLD_MS);
}

function cancelHold(){
  if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
  startTime = null;
}

// Mouse
zone.addEventListener('mousedown', startHold);
zone.addEventListener('mouseup', cancelHold);
zone.addEventListener('mouseleave', cancelHold);

// Touch
zone.addEventListener('touchstart', startHold, {passive:true});
zone.addEventListener('touchend', cancelHold);
zone.addEventListener('touchcancel', cancelHold);
</script>
</body>
</html>
