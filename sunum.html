<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunumlar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a0f00;
            font-family: sans-serif;
        }

        /* =============================================
           ANA ÇERÇEVE DÜZENİ
           ============================================= */
        .frame-wrapper {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #020e10;
            z-index: 0;
        }

        /* Dış turkuaz çerçeve */
        .outer-frame {
            position: relative;
            width: calc(100% - 48px);
            height: calc(100% - 80px); /* alt kısımda logo yuvası için boşluk */
            border: 10px solid #00565e;
            border-radius: 8px;
            box-shadow:
                0 0 0 3px #007d88,
                0 0 0 6px #002f35,
                inset 0 0 30px rgba(0,0,0,0.6),
                0 8px 40px rgba(0,0,0,0.8);
            background: #000;
            /* Alt kenar ortasında logo yuvası için kesik */
            margin-bottom: 30px;
        }

        /* Çerçeve köşe süsleri */
        .outer-frame::before,
        .outer-frame::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #00d4e0;
            border-style: solid;
        }
        .outer-frame::before {
            top: -14px; left: -14px;
            border-width: 4px 0 0 4px;
            border-radius: 4px 0 0 0;
        }
        .outer-frame::after {
            bottom: -14px; right: -14px;
            border-width: 0 4px 4px 0;
            border-radius: 0 0 4px 0;
        }

        /* Çerçeve diğer köşeler (pseudo element'i iki tane olduğundan span ile) */
        .corner-tr, .corner-bl {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #00d4e0;
            border-style: solid;
        }
        .corner-tr {
            top: -14px; right: -14px;
            border-width: 4px 4px 0 0;
            border-radius: 0 4px 0 0;
        }
        .corner-bl {
            bottom: -14px; left: -14px;
            border-width: 0 0 4px 4px;
            border-radius: 0 0 0 4px;
        }

        /* Sunum içeriği (tam çerçeveyi doldurur) */
        .media-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
            border-radius: 0px;
        }

        /* =============================================
           ALT ORTA LOGO YUVASI
           ============================================= */
        .logo-mount {
            position: absolute;
            bottom: -52px; /* çerçevenin altına taşar */
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            z-index: 9999;
        }

        /* Yuvayı oluşturan şekil — yarı daire + yatay çizgiler */
        .logo-cradle {
            position: absolute;
            bottom: -38px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 56px;
            z-index: 9998;
        }

        /* Çerçeve alt kenarındaki logo kanalı (SVG ile) */
        .logo-channel {
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 70px;
            z-index: 9997;
            pointer-events: none;
        }

        /* Logo konteyner — animasyonlar burada */
        .fixed-logo-container {
            position: absolute;
            bottom: -52px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: auto;
            z-index: 9999;
            pointer-events: none;
            overflow: hidden;
            perspective: 1000px;
            /* Daire şeklinde arka plan */
            background: radial-gradient(circle, #041c20 60%, #020e10 100%);
            border-radius: 50%;
            padding: 12px;
            border: 3px solid #007d88;
            box-shadow:
                0 0 0 2px #00565e,
                0 4px 20px rgba(0,0,0,0.9),
                inset 0 2px 8px rgba(0,0,0,0.5);
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fixed-logo-container img {
            width: 75px;
            height: auto;
            display: block;
            transform-style: preserve-3d;
            animation: combinedFlip 10s infinite ease-in-out;
        }

        /* Parlama Efekti */
        .fixed-logo-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.6) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-25deg);
            z-index: 10;
            border-radius: 50%;
            animation: combinedGlint 10s infinite ease-in-out;
        }

        @keyframes combinedFlip {
            0%, 85% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        @keyframes combinedGlint {
            0%, 85% { left: -150%; }
            100% { left: 150%; }
        }

        /* Yuva bağlantı çizgileri (logo yuvasının iki yanından çerçeveye uzanan çizgiler) */
        .logo-arms {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 55px;
            z-index: 9996;
            pointer-events: none;
        }

        /* =============================================
           GİRİŞ MENÜSÜ
           ============================================= */
        .menu-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(17,17,17,0.97);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        .menu-title {
            color: #fff;
            margin-bottom: 30px;
            font-size: 2rem;
            letter-spacing: 1px;
        }
        .btn-group {
            display: flex;
            gap: 20px;
        }
        .menu-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-harezmi {
            background-color: #00adb5;
            color: #fff;
        }
        .btn-harezmi:hover {
            background-color: #007a80;
            transform: scale(1.05);
        }
        .btn-okul {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Slayt stilleri */
        .slide {
            position: absolute;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            z-index: 1;
            /* Boyut JS tarafından ayarlanır */
        }
        .slide.active {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }
    </style>
</head>
<body>

<div class="frame-wrapper">
    <div class="outer-frame">
        <span class="corner-tr"></span>
        <span class="corner-bl"></span>

        <!-- Sunum alanı -->
        <div class="media-container" id="presentation">
            <img class="slide" src="1.png" alt="Slayt 1">
            <img class="slide" src="2.png" alt="Slayt 2">
            <img class="slide" src="3.png" alt="Slayt 3">
            <img class="slide" src="4.png" alt="Slayt 4">
            <img class="slide" src="5.png" alt="Slayt 5">
            <img class="slide" src="6.png" alt="Slayt 6">
            <img class="slide" src="7.png" alt="Slayt 7">
            <img class="slide" src="8.png" alt="Slayt 8">
            <img class="slide" src="9.png" alt="Slayt 9">
            <img class="slide" src="10.png" alt="Slayt 10">
            <img class="slide" src="11.png" alt="Slayt 11">
            <img class="slide" src="12.png" alt="Slayt 12">
            <video class="slide" src="1.mp4" muted playsinline></video>
            <video class="slide" src="2.mp4" muted playsinline></video>

            <!-- Menü (sunum içinde) -->
            <div class="menu-container" id="mainMenu">
                <h1 class="menu-title">Lütfen Bir Sunum Seçin</h1>
                <div class="btn-group">
                    <button class="menu-btn btn-harezmi" onclick="startHarezmi()">Harezmi Sunumu</button>
                    <button class="menu-btn btn-okul" disabled>Okul Sunumu</button>
                </div>
            </div>
        </div>

        <!-- Çerçevenin alt ortasında logo yuvası kolları (SVG) -->
        <svg class="logo-arms" viewBox="0 0 200 55" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
            <!-- Sol kol: çerçeve kenarından logo yuvasına -->
            <path d="M 0 8 L 42 8 Q 50 8 55 16 L 60 30 Q 63 38 70 42 A 30 30 0 0 0 100 52 A 30 30 0 0 0 130 42 Q 137 38 140 30 L 145 16 Q 150 8 158 8 L 200 8"
                  stroke="#007d88" stroke-width="3" fill="none"/>
            <path d="M 0 8 L 42 8 Q 50 8 55 16 L 60 30 Q 63 38 70 42 A 30 30 0 0 0 100 52 A 30 30 0 0 0 130 42 Q 137 38 140 30 L 145 16 Q 150 8 158 8 L 200 8"
                  stroke="#00d4e0" stroke-width="1" fill="none" opacity="0.5"/>
        </svg>

        <!-- Logo (yuva içinde) -->
        <div class="fixed-logo-container">
            <img src="anasayfa.png" alt="Logo">
        </div>
    </div>
</div>

<script>
    const slides = document.querySelectorAll('.slide');
    let currentIndex = 0;
    let slideTimeout;
    const imageDuration = 7000;

    // Slaytı çerçeveye tam sığdır (hiç boşluk kalmaz, içerik de kesilmez)
    // Mantık: çerçevenin en-boy oranı ile slaytın oranını karşılaştır,
    // hangisi daha "geniş" ise genişliği çerçeveye sabitle, diğerinde yüksekliği sabitle.
    function fitSlide(el, naturalW, naturalH) {
        const container = document.getElementById('presentation');
        const cw = container.clientWidth;
        const ch = container.clientHeight;

        const containerRatio = cw / ch;
        const slideRatio = naturalW / naturalH;

        let w, h;
        if (slideRatio > containerRatio) {
            // Slayt daha geniş → yüksekliği tam doldur, genişlik taşar → kırp
            h = ch;
            w = ch * slideRatio;
        } else {
            // Slayt daha uzun → genişliği tam doldur, yükseklik taşar → kırp
            w = cw;
            h = cw / slideRatio;
        }

        el.style.width  = w + 'px';
        el.style.height = h + 'px';
        el.style.top    = ((ch - h) / 2) + 'px';
        el.style.left   = ((cw - w) / 2) + 'px';
    }

    // Tüm resimlerin doğal boyutunu önceden yükle ve kaydet
    slides.forEach(el => {
        if (el.tagName === 'IMG') {
            const tmp = new Image();
            tmp.onload = () => {
                el._nw = tmp.naturalWidth;
                el._nh = tmp.naturalHeight;
                if (el.classList.contains('active')) fitSlide(el, el._nw, el._nh);
            };
            tmp.src = el.src;
        } else if (el.tagName === 'VIDEO') {
            el.addEventListener('loadedmetadata', () => {
                el._nw = el.videoWidth;
                el._nh = el.videoHeight;
                if (el.classList.contains('active')) fitSlide(el, el._nw, el._nh);
            });
        }
    });

    // Ekran boyutu değişince tüm aktif slaytı yeniden ölçekle
    window.addEventListener('resize', () => {
        const active = document.querySelector('.slide.active');
        if (active && active._nw) fitSlide(active, active._nw, active._nh);
    });

    function startHarezmi() {
        const menu = document.getElementById('mainMenu');
        menu.style.opacity = '0';
        setTimeout(() => {
            menu.style.display = 'none';
            showSlide(0);
        }, 500);
    }

    function showSlide(index) {
        clearTimeout(slideTimeout);
        const previousSlide = slides[currentIndex];
        currentIndex = index;
        const currentSlide = slides[currentIndex];
        if (previousSlide) previousSlide.classList.remove('active');
        currentSlide.classList.add('active');

        // Boyut bilgisi hazırsa hemen fit et
        if (currentSlide._nw) fitSlide(currentSlide, currentSlide._nw, currentSlide._nh);

        if (previousSlide && previousSlide.tagName === 'VIDEO' && previousSlide !== currentSlide) {
            setTimeout(() => {
                if (!previousSlide.classList.contains('active')) {
                    previousSlide.pause();
                    previousSlide.currentTime = 0;
                }
            }, 800);
        }
        if (currentSlide.tagName === 'IMG') {
            slideTimeout = setTimeout(nextSlide, imageDuration);
        } else if (currentSlide.tagName === 'VIDEO') {
            currentSlide.play().catch(error => {
                console.log("Video oynatılamadı, geçiliyor...", error);
                nextSlide();
            });
            currentSlide.addEventListener('ended', nextSlide, { once: true });
        }
    }

    function nextSlide() {
        let nextIndex = currentIndex + 1;
        if (nextIndex >= slides.length) nextIndex = 0;
        showSlide(nextIndex);
    }
</script>

</body>
</html>
