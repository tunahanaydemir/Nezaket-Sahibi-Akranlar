<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunumlar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        
        /* ----------------------------------------------- */
        /* SENKRONİZE 10 SANİYELİK TV LOGO ANİMASYONU       */
        /* ----------------------------------------------- */
        .fixed-logo-container {
            position: fixed;
            top: 25px;
            left: 25px;
            width: 120px;
            height: auto;
            z-index: 9999;
            pointer-events: none;
            overflow: hidden; /* Parlama dışarı taşmasın */
            perspective: 1000px; /* 3D Dönüş derinliği */
        }

        .fixed-logo-container img {
            width: 100%;
            height: auto;
            display: block;
            transform-style: preserve-3d;
            /* 10 saniyede bir döner */
            animation: combinedFlip 10s infinite ease-in-out;
        }

        /* Parlama Efekti Katmanı */
        .fixed-logo-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right, 
                rgba(255, 255, 255, 0) 0%, 
                rgba(255, 255, 255, 0.6) 50%, /* Parlama netliği hafif artırıldı */
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-25deg);
            z-index: 10;
            /* 10 saniyede bir parlar */
            animation: combinedGlint 10s infinite ease-in-out;
        }

        /* 10 Saniyelik Döngü: Dönme Hareketi (%85'e kadar bekler, son 1.5 sn'de döner) */
        @keyframes combinedFlip {
            0%, 85% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        /* 10 Saniyelik Döngü: Aynı Anda Parlama Hareketi */
        @keyframes combinedGlint {
            0%, 85% { left: -150%; }
            100% { left: 150%; }
        }
        /* ----------------------------------------------- */

        /* Giriş Menüsü Tasarımı */
        .menu-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .menu-title {
            color: #fff;
            margin-bottom: 30px;
            font-size: 2rem;
            letter-spacing: 1px;
        }
        .btn-group {
            display: flex;
            gap: 20px;
        }
        .menu-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        /* Aktif Buton (Harezmi) */
        .btn-harezmi {
            background-color: #00adb5;
            color: #fff;
        }
        .btn-harezmi:hover {
            background-color: #007a80;
            transform: scale(1.05);
        }
        /* Pasif Buton (Okul) */
        .btn-okul {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Sunum Alanı */
        .media-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }
        
        /* Slaytların Temel Durumu */
        .slide {
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            z-index: 1;
        }
        
        /* Aktif Slayt */
        .slide.active {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }
    </style>
</head>
<body>

<div class="fixed-logo-container">
    <img src="anasayfa.png" alt="Logo">
</div>

<div class="menu-container" id="mainMenu">
    <h1 class="menu-title">Lütfen Bir Sunum Seçin</h1>
    <div class="btn-group">
        <button class="menu-btn btn-harezmi" onclick="startHarezmi()">Harezmi Sunumu</button>
        <button class="menu-btn btn-okul" disabled>Okul Sunumu</button>
    </div>
</div>

<div class="media-container" id="presentation">
    <img class="slide" src="1.png" alt="Slayt 1">
    <img class="slide" src="2.png" alt="Slayt 2">
    <img class="slide" src="3.png" alt="Slayt 3">
    <img class="slide" src="4.png" alt="Slayt 4">
    <img class="slide" src="5.png" alt="Slayt 5">
    <img class="slide" src="6.png" alt="Slayt 6">
    <img class="slide" src="7.png" alt="Slayt 7">
    <img class="slide" src="8.png" alt="Slayt 8">
    <img class="slide" src="9.png" alt="Slayt 9">
    <img class="slide" src="10.png" alt="Slayt 10">
    <img class="slide" src="11.png" alt="Slayt 11">
    <img class="slide" src="12.png" alt="Slayt 12">

    <video class="slide" src="1.mp4" muted playsinline></video>
    <video class="slide" src="2.mp4" muted playsinline></video>
</div>

<script>
    const slides = document.querySelectorAll('.slide');
    let currentIndex = 0;
    let slideTimeout;
    const imageDuration = 7000; // Resimler için 7 saniye kalma süresi

    function startHarezmi() {
        const menu = document.getElementById('mainMenu');
        menu.style.opacity = '0';
        setTimeout(() => {
            menu.style.display = 'none';
            showSlide(0);
        }, 500); 
    }

    function showSlide(index) {
        clearTimeout(slideTimeout);

        const previousSlide = slides[currentIndex];
        
        currentIndex = index;
        const currentSlide = slides[currentIndex];
        
        if (previousSlide) previousSlide.classList.remove('active');
        currentSlide.classList.add('active');

        if (previousSlide && previousSlide.tagName === 'VIDEO' && previousSlide !== currentSlide) {
            setTimeout(() => {
                if (!previousSlide.classList.contains('active')) {
                    previousSlide.pause();
                    previousSlide.currentTime = 0;
                }
            }, 800);
        }

        if (currentSlide.tagName === 'IMG') {
            slideTimeout = setTimeout(nextSlide, imageDuration);
        } else if (currentSlide.tagName === 'VIDEO') {
            currentSlide.play().catch(error => {
                console.log("Video oynatılamadı, geçiliyor...", error);
                nextSlide();
            });
            currentSlide.addEventListener('ended', nextSlide, { once: true });
        }
    }

    function nextSlide() {
        let nextIndex = currentIndex + 1;
        if (nextIndex >= slides.length) {
            nextIndex = 0;
        }
        showSlide(nextIndex);
    }
</script>

</body>
</html>
