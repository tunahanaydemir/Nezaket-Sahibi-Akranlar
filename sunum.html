<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunum Seçim Paneli</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        
        /* Giriş Menüsü Tasarımı */
        .menu-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .menu-title {
            color: #fff;
            margin-bottom: 30px;
            font-size: 2rem;
            letter-spacing: 1px;
        }
        .btn-group {
            display: flex;
            gap: 20px;
        }
        .menu-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        /* Aktif Buton (Harezmi) */
        .btn-harezmi {
            background-color: #00adb5;
            color: #fff;
        }
        .btn-harezmi:hover {
            background-color: #007a80;
            transform: scale(1.05);
        }
        /* Pasif Buton (Okul) */
        .btn-okul {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Sunum Alanı */
        .media-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .slide {
            display: none;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .slide.active {
            display: block;
        }
    </style>
</head>
<body>

<!-- GİRİŞ MENÜSÜ -->
<div class="menu-container" id="mainMenu">
    <h1 class="menu-title">Lütfen Bir Sunum Seçin</h1>
    <div class="btn-group">
        <button class="menu-btn btn-harezmi" onclick="startHarezmi()">Harezmi Sunumu</button>
        <button class="menu-btn btn-okul" disabled>Okul Sunumu (Yakında)</button>
    </div>
</div>

<!-- MEDYA OYNATICI ALANI -->
<div class="media-container" id="presentation">
    <!-- PNG'ler (10 saniye kalacak) -->
    <img class="slide" src="1.png" alt="Slayt 1">
    <img class="slide" src="2.png" alt="Slayt 2">
    <img class="slide" src="3.png" alt="Slayt 3">
    <img class="slide" src="4.png" alt="Slayt 4">
    <img class="slide" src="5.png" alt="Slayt 5">
    <img class="slide" src="6.png" alt="Slayt 6">
    <img class="slide" src="7.png" alt="Slayt 7">
    <img class="slide" src="8.png" alt="Slayt 8">
    <img class="slide" src="9.png" alt="Slayt 9">
    <img class="slide" src="10.png" alt="Slayt 10">
    <img class="slide" src="11.png" alt="Slayt 11">
    <img class="slide" src="12.png" alt="Slayt 12">

    <!-- MP4'ler -->
    <video class="slide" src="1.mp4" muted playsinline></video>
    <video class="slide" src="2.mp4" muted playsinline></video>
</div>

<script>
    const slides = document.querySelectorAll('.slide');
    let currentIndex = 0;
    let slideTimeout;
    const imageDuration = 10000; // 10 saniye

    // Harezmi Sunumunu Başlatan Fonksiyon
    function startHarezmi() {
        // Menüyü ekrandan kaldır
        const menu = document.getElementById('mainMenu');
        menu.style.opacity = '0';
        setTimeout(() => {
            menu.style.display = 'none';
            // İlk slaytı göster ve döngüyü başlat
            showSlide(0);
        }, 500); 
    }

    function showSlide(index) {
        // Eski aktifi temizle
        slides[currentIndex].classList.remove('active');
        
        if (slides[currentIndex].tagName === 'VIDEO') {
            slides[currentIndex].pause();
            slides[currentIndex].currentTime = 0;
        }

        // Yeni slaytı aktif et
        currentIndex = index;
        const currentSlide = slides[currentIndex];
        currentSlide.classList.add('active');

        clearTimeout(slideTimeout);

        if (currentSlide.tagName === 'IMG') {
            slideTimeout = setTimeout(nextSlide, imageDuration);
        } else if (currentSlide.tagName === 'VIDEO') {
            currentSlide.play().catch(error => {
                console.log("Video oynatılamadı, geçiliyor...", error);
                nextSlide();
            });
            currentSlide.addEventListener('ended', nextSlide, { once: true });
        }
    }

    function nextSlide() {
        let nextIndex = currentIndex + 1;
        if (nextIndex >= slides.length) {
            nextIndex = 0; // Başa dön
        }
        showSlide(nextIndex);
    }
</script>

</body>
</html>
